<svg xmlns="http://www.w3.org/2000/svg" width="660" height="150" viewBox="0 0 660 150" role="img" aria-label="MariaDB Windows Builds">
  <style>
    .word { fill: #1f2937; font: 700 44px "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .sub  { fill: #0d9488; font: 600 16px "Segoe UI", "Helvetica Neue", Arial, sans-serif; letter-spacing: 7px; }
    @media (prefers-color-scheme: dark) {
      .word { fill: #e5e7eb; }
    }
  </style>
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
  </defs>

  <!-- emblem: hexagon + database cylinder -->
  <g transform="translate(78,75)">
    <path d="M0,-62 L54,-36 L54,36 L0,62 L-54,36 L-54,-36 Z"
          fill="none" stroke="url(#teal)" stroke-width="8" stroke-linejoin="round"/>
    <path d="M-23,-15 L-23,15 A23,9 0 0 0 23,15 L23,-15"
          fill="#0f766e"/>
    <ellipse cx="0" cy="-15" rx="23" ry="9" fill="url(#teal)"/>
    <path d="M-23,2 A23,9 0 0 0 23,2" fill="none" stroke="#5eead4" stroke-width="2" opacity="0.55"/>
  </g>

  <text class="word" x="168" y="80">MariaDB</text>
  <text class="sub"  x="171" y="112">WINDOWS BUILDS</text>
</svg>
